services:
  - type: web
    name: trusthire
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TrustHire
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # Set these five manually in the Render dashboard from your Neon
      # project's connection details — see DEPLOY.md. Using Neon instead of
      # Render's own Postgres because Render's free database plan expires
      # after 30 days; Neon's free tier does not.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      # UPLOADS_DISK is left unset, so admin-uploaded photos (hero/trust
      # images, listing photo edits) go to the container's local disk. That
      # disk is wiped on every deploy (and rebuilt fresh each time on
      # Render's Docker runtime), so those photos need re-uploading after a
      # redeploy — a deliberate trade-off to avoid Cloudflare R2's
      # card-on-file requirement for now. Set UPLOADS_DISK=r2 (plus the
      # AWS_* vars) later if that becomes annoying — see DEPLOY.md.
